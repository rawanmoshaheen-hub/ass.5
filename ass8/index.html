<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's For Dinner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    
    <nav class="navbar bg-white border-bottom py-3 px-4">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <div class="logo-circle me-3">
                    <i class="fa-solid fa-utensils text-white"></i>
                </div>
                <div>
                    <h6 class="mb-0 fw-bold">What's For Dinner</h6>
                    <small class="text-muted">Your daily meal inspiration</small>
                </div>
            </div>

            <div class="d-flex align-items-center gap-4">
                <i class="fa-solid fa-bookmark text-secondary fs-5 nav-icon"></i>
                <i class="fa-solid fa-rotate-right text-secondary fs-5 nav-icon"></i>
                <i class="fa-solid fa-gear text-secondary fs-5 nav-icon"></i>
                <div class="profile-icon">
                    <i class="fa-solid fa-question text-white"></i>
                </div>
            </div>
        </div>
    </nav>

    
    <div class="container-fluid min-vh-100 d-flex align-items-start justify-content-center p-3 p-md-4 pt-4">
        <div class="recipe-card">
            <div class="row g-4">
                
                <div class="col-lg-5">
                    <div class="position-relative">
                        <span class="badge bg-white text-dark position-absolute top-0 start-0 m-3 rounded-pill px-3 py-2 shadow-sm fw-normal">
                            <i class="fa-solid fa-star text-warning"></i>
                            <span id="rating-text"></span>
                        </span>
                        <img id="recipe-img" src="./avatar-1 (1).jpg" class="img-fluid rounded-4 w-100" alt="Recipe">
                    </div>

                    <div class="time-card">
                        <div class="row text-center">
                            <div class="col-4">
                                <i class="fa-regular fa-clock time-icon"></i>
                                <p class="time-label">Prep Time</p>
                                <p class="time-value" id="prep-time"></p>
                            </div>
                            <div class="col-4">
                                <i class="fa-solid fa-fire-flame-curved time-icon"></i>
                                <p class="time-label">Cook Time</p>
                                <p class="time-value" id="cook-time"></p>
                            </div>
                            <div class="col-4">
                                <i class="fa-solid fa-users time-icon"></i>
                                <p class="time-label">Servings</p>
                                <p class="time-value" id="servings"></p>
                            </div>
                        </div>
                    </div>
                </div>

                
                <div class="col-lg-7">
                    <div class="mb-3" id="tags-container"></div>

                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h1 class="recipe-title mb-0" id="recipe-title"></h1>
                        <div class="d-flex gap-2">
                            <button class="btn btn-light rounded-3 px-3">
                                <i class="fa-solid fa-bookmark" style="color: #ff6b35;"></i>
                            </button>
                            <button class="btn btn-light rounded-3 px-3">
                                <i class="fa-solid fa-share-nodes" style="color: #ff6b35;"></i>
                            </button>
                        </div>
                    </div>

                    <p class="recipe-desc" id="recipe-desc"></p>

                    
                    <ul class="nav border-bottom mb-3 gap-4 custom-tabs">
                        <li class="nav-item">
                            <button class="nav-link text-secondary border-0 px-0 pb-3 active" onclick="showTab('ingredients', this)">
                                <i class="fa-solid fa-list-ul"></i>Ingredients
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-secondary border-0 px-0 pb-3" onclick="showTab('instructions', this)">
                                <i class="fa-solid fa-book-open"></i>Instructions
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-secondary border-0 px-0 pb-3" onclick="showTab('nutrition', this)">
                                <i class="fa-solid fa-chart-pie"></i>Nutrition
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-secondary border-0 px-0 pb-3" onclick="showTab('tips', this)">
                                <i class="fa-solid fa-lightbulb"></i>Chef's Tips
                            </button>
                        </li>
                    </ul>

                    <div id="tab-content" class="mb-4"></div>

                    <button class="btn-try" onclick="tryAnotherRecipe()">
                        <i class="fa-solid fa-rotate-right me-2"></i>Try Another Recipe
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
